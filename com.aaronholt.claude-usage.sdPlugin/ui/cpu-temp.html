<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 12px 16px;
        background: #2d2d2d;
        color: #d8d8d8;
        font: 13px -apple-system, "Segoe UI", Arial, sans-serif;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      label {
        flex: 0 0 90px;
        text-align: right;
      }
      select {
        flex: 1;
        min-width: 0;
        padding: 4px 6px;
        background: #3d3d3d;
        color: #d8d8d8;
        border: 1px solid #555;
        border-radius: 3px;
        font: inherit;
      }
      .hint {
        margin: 4px 0 0 102px;
        color: #9a9a9a;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <!-- Values read by CpuTempAction in src/actions/cpu-temp.ts. -->
    <div class="item">
      <label for="show">Show</label>
      <select id="show">
        <option value="avg">Average of all cores</option>
        <option value="max">Hottest core</option>
      </select>
    </div>
    <div class="item">
      <label for="unit">Unit</label>
      <select id="unit">
        <option value="c">Celsius (°C)</option>
        <option value="f">Fahrenheit (°F)</option>
      </select>
    </div>
    <p class="hint">Read from the Mac’s CPU sensors every 2 seconds — no admin rights needed. The other reading shows underneath.</p>

    <script>
      // Stream Deck calls this global when the Property Inspector opens.
      function connectElgatoStreamDeckSocket(port, uuid, registerEvent, _info, actionInfo) {
        const settings = (JSON.parse(actionInfo).payload || {}).settings || {};
        const fields = { show: "avg", unit: "c" };

        const ws = new WebSocket("ws://127.0.0.1:" + port);
        ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
        for (const [id, fallback] of Object.entries(fields)) {
          const select = document.getElementById(id);
          select.value = settings[id] || fallback;
          select.addEventListener("change", () => {
            settings[id] = select.value;
            ws.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
          });
        }
      }
    </script>
  </body>
</html>
